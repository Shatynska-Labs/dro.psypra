name: Deploy

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  # Lowercase literal: must match docker-compose.yml and the `dro-psypra`
  # entry in the infrastructure repo's deploy_apps (image reclamation keys
  # on the last path segment).
  IMAGE_NAME: ghcr.io/shatynska-labs/dro-psypra

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npm run build

  build-and-push:
    name: Build and push image
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: build-dro-psypra
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    name: Deploy (production)
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-dro-psypra-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # SSH to the host is reachable only over the tailnet.
      - name: Connect to the tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ vars.MAIN_PRODUCTION_DEPLOY_HOST }}

      - name: Render .env
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: printf 'IMAGE_TAG=%s\n' "$IMAGE_TAG" > .env

      - name: Deliver and deploy
        env:
          DEPLOY_HOST: ${{ vars.MAIN_PRODUCTION_DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DRO_PSYPRA_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          tar -czf - docker-compose.yml .env \
            | ssh -i ~/.ssh/deploy_key \
                -o StrictHostKeyChecking=accept-new \
                "deploy@${DEPLOY_HOST}"

      - name: Check the public site
        run: |
          for i in $(seq 1 12); do
            if curl -fsS -o /dev/null https://dro.psypra.com/; then exit 0; fi
            sleep 10
          done
          echo "::warning::https://dro.psypra.com/ is not answering yet (DNS or certificate may still be pending)"
